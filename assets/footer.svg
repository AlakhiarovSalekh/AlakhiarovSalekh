<rect x="1" y="1" width="798" height="148" rx="22" fill="url(#bg)" stroke="#2A3A50"/>

<text x="400" y="56" text-anchor="middle" fill="#F8FAFC" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="800" letter-spacing=".8">Salekh Alakhiarov</text>
