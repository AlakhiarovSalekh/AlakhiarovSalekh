<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="400" gradientUnits="userSpaceOnUse">
    <stop stop-color="#06101D"/>
    <stop offset="0.46" stop-color="#0A1830"/>
    <stop offset="1" stop-color="#17142D"/>
  </linearGradient>
  <radialGradient id="blueGlow" cx="0" cy="0" r="1" gradientTransform="translate(180 365) rotate(-38) scale(560 330)" gradientUnits="userSpaceOnUse">
    <stop stop-color="#0284C7" stop-opacity=".34"/>
    <stop offset="1" stop-color="#0284C7" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="violetGlow" cx="0" cy="0" r="1" gradientTransform="translate(1050 25) rotate(143) scale(510 310)" gradientUnits="userSpaceOnUse">
    <stop stop-color="#7C3AED" stop-opacity=".32"/>
    <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="accent" x1="86" y1="0" x2="678" y2="0">
    <stop stop-color="#38BDF8"/>
    <stop offset=".52" stop-color="#22D3EE"/>
    <stop offset="1" stop-color="#8B5CF6"/>
  </linearGradient>
  <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#38BDF8"/>
    <stop offset=".55" stop-color="#60A5FA"/>
    <stop offset="1" stop-color="#A78BFA"/>
  </linearGradient>
  <filter id="shadow" x="-35%" y="-35%" width="170%" height="170%">
    <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity=".34"/>
  </filter>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
    <path d="M36 0H0V36" stroke="#94A3B8" stroke-opacity=".045"/>
  </pattern>
</defs>

<rect width="1200" height="400" rx="26" fill="url(#bg)"/>
<rect width="1200" height="400" rx="26" fill="url(#blueGlow)"/>
<rect width="1200" height="400" rx="26" fill="url(#violetGlow)"/>
<rect width="1200" height="400" rx="26" fill="url(#grid)"/>
<rect x="1" y="1" width="1198" height="398" rx="25" stroke="#94A3B8" stroke-opacity=".15"/>

